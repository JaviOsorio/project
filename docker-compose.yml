version: '3.9'

services:
  db:
    image: postgres:16-alpine
    container_name: barberconnect-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-barberconnect}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: barberconnect-api
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - '3000:3000'
    env_file:
      - .env
    environment:
      DB_HOST: db

volumes:
  postgres_data:
